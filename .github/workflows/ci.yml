# CI — 모든 브랜치 push · PR 에서 테스트한다. 모델 · llama.cpp · 진짜 CLI 없이 (tests/conftest.py 가 가짜로 바꿔 끼운다).
# 작업 방식(TDD): 브랜치에서 테스트를 먼저 쓰고 → 구현 → push → 여기 초록 → PR 로 main 에 합친다.
name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

concurrency:   # 같은 브랜치에 새로 push 하면 앞의 실행은 그만둔다
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: 서버 테스트 (pytest · Windows)
    runs-on: windows-latest   # 실행 대상이 Windows (PowerShell 5.1 · 작업 개체 · 경로) 라 같은 OS 에서
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 패키지 설치
        run: python -m pip install -r requirements.txt -r requirements-claude-code.txt pytest-github-actions-annotate-failures
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider -rf   # 실패한 테스트는 PR · 실행 화면에 줄 단위 표시(annotate-failures)

  web:
    name: 화면 (타입 · vitest · 빌드 · API 계약)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: API 타입이 계약(openapi.json)과 같은지
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || { echo "::error::web/openapi.json 과 src/api/schema.d.ts 가 다릅니다 — web 에서 npm run gen:api 를 실행해 커밋하세요"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
