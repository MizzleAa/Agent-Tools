name: research-report
description: 조사 → 보고서 작성 (조사한 사실만으로 report.md 를 만든다)
nodes:
  - id: research
    title: 조사
    profile: researcher
    prompt: |
      다음 주제를 조사해 확인한 사실만 번호 목록으로 정리하라. 의견·결론은 쓰지 않는다.
      사실마다 실제로 읽은 페이지 주소와 페이지에 적힌 날짜를 붙인다.

      주제: {{input}}
  - id: write
    title: 보고서 작성
    profile: general
    prompt: |
      아래 조사 결과만 근거로 보고서를 써서 report.md 로 저장하라. 조사 결과에 없는 내용은 쓰지 않는다.
      형식: 한 줄 요약 → 핵심 내용(표로 비교할 것은 표) → 확인 못 한 것 → 출처 목록.
      저장한 뒤 답에는 한 줄 요약과 파일 이름만 쓴다.

      ## 요청
      {{input}}

      ## 조사 결과
      {{research}}
