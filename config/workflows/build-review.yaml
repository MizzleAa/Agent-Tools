name: build-review
description: 만들기 → 다른 눈으로 검토 → 문제 고치기 (개발 작업을 한 번 더 확인)
nodes:
  - id: build
    title: 만들기
    profile: coder
    prompt: |
      {{input}}
  - id: review
    title: 검토
    profile: reviewer
    prompt: |
      아래 요구로 방금 만든 결과물을 검토하라. 파일은 고치지 않는다.

      ## 원래 요구
      {{input}}

      ## 만든 쪽의 보고 (그대로 믿지 말고 확인할 것)
      {{build}}
  - id: fix
    title: 고치기
    profile: coder
    prompt: |
      검토에서 나온 문제를 심각한 것부터 실제로 파일을 고쳐 해결한다. 고친 뒤에는 다시 실행·테스트로 확인하고 개발 규격 형식으로 최종 보고한다.
      파일을 고치거나 실행하지 않고 보고만 하면 완료로 인정되지 않는다.
      검토 결과가 '문제 없음'이면 고치지 말고, 테스트·실행 명령을 직접 다시 돌려 확인한 결과로 최종 보고한다 (검토 결과를 옮겨 적는 것은 근거가 아니다).

      ## 원래 요구
      {{input}}

      ## 검토 결과
      {{review}}
